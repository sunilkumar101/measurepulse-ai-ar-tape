measurepulse.admob.interstitial=
measurepulse.admob.rewarded=
measurepulse.admob.native=
# Hashed test-device IDs (logcat: "addTestDeviceHashedId") go in local.properties, which is git-ignored:
#   measurepulse.admob.testDeviceIds=ABC123...,DEF456...
