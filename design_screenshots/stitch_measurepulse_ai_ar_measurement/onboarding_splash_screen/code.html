<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>MeasurePulse AI — Spatial Onboarding</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            lime: {
              electric: '#DDF83D',
            },
            deep: {
              dark: '#111322',
            }
          },
          boxShadow: {
            'electric-glow': '0 0 25px rgba(221, 248, 61, 0.45), 0 10px 20px rgba(0, 0, 0, 0.3)',
            'glass-deep': '0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.4)',
          }
        }
      }
    };
  </script>
<!-- BEGIN: Custom CSS Styling -->
<style data-purpose="glassmorphic-styles">
    /* Custom Frosted Glassmorphism for High-Precision Rendering */
    .glass-pill {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      border: 1px solid rgba(255, 255, 255, 0.32);
      transform: rotate(-8deg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }
    
    .glass-card-subtle {
      background: rgba(17, 19, 34, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 3D Iridescent Holographic Orb */
    .iridescent-orb {
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #b892ff 25%, #7038ff 50%, #2e088a 75%, #0d0133 100%);
      box-shadow: 0 0 20px rgba(184, 146, 255, 0.6), inset -2px -4px 10px rgba(0, 0, 0, 0.6);
    }
  </style>
<style data-purpose="waveform-animations">
    /* Waveform subtle sound frequency pulsation */
    @keyframes wavePulse {
      0%, 100% { transform: scaleY(1); opacity: 0.8; }
      50% { transform: scaleY(0.4); opacity: 0.4; }
    }
    .wave-bar {
      transform-origin: bottom;
      animation: wavePulse 1.4s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.2s; }
    .wave-bar:nth-child(6) { animation-delay: 0.5s; }
    .wave-bar:nth-child(7) { animation-delay: 0.1s; }
    .wave-bar:nth-child(8) { animation-delay: 0.35s; }
    .wave-bar:nth-child(9) { animation-delay: 0.25s; }
    .wave-bar:nth-child(10) { animation-delay: 0.4s; }
    .wave-bar:nth-child(11) { animation-delay: 0.15s; }
    .wave-bar:nth-child(12) { animation-delay: 0.3s; }
    .wave-bar:nth-child(13) { animation-delay: 0.55s; }
  </style>
<!-- END: Custom CSS Styling -->
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden select-none m-0 p-0 flex justify-center items-center min-h-screen">
<!-- BEGIN: Mobile Device Frame Container (iPhone 15 Pro / standard 390x844 bounds) -->
<main class="relative w-full max-w-[420px] h-[100dvh] max-h-[900px] overflow-hidden flex flex-col justify-between shadow-2xl bg-black">
<!-- BEGIN: Background Image with Multi-Stage Readability Gradient Overlay -->
<div class="absolute inset-0 z-0 pointer-events-none" data-purpose="full-bleed-background">
<img alt="Ultra-modern architectural luxury villa with AR measurement laser grid lines and perspective dots" class="w-full h-full object-cover object-center transform scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCSPFCqbUDTCPw2t1uxCbQ7jdqvwoFcuKNpGCXJXKBdaYvSHg0XcbW8qDT1wtHMesx4qmgAEG51W7Nbts_vGpNnNh-HZwOooPzqQmfCZKW64IwHtzL1TsodIob-__ucMs22NhaFuxsYx717qTCL4YshDS3SMtk0XJ5X5YWa5snQzV_HglbZcYKRCW6zaYysieF5JX3UIbtT99H1flSzXYw9MXkBmsZKkOcHOw1GhKQ"/>
<!-- Top Vignette for Status & Header legibility -->
<div class="absolute inset-x-0 top-0 h-64 bg-gradient-to-b from-[#0b0d1e]/95 via-[#101223]/70 to-transparent pointer-events-none"></div>
<!-- Bottom Deep Vignette for Action Bar & Body legibility -->
<div class="absolute inset-x-0 bottom-0 h-96 bg-gradient-to-t from-black via-black/75 to-transparent"></div>
<!-- Subtle ambient color bleed -->
<div class="absolute inset-0 bg-indigo-950/20 mix-blend-color"></div>
</div>
<!-- END: Background Image with Multi-Stage Readability Gradient Overlay -->
<!-- BEGIN: Top Bar & Status Header -->
<header class="relative z-20 pt-3 px-6 flex flex-col space-y-3" data-purpose="top-navigation-status">
<!-- iOS Mobile Status Bar -->
<div class="flex justify-between items-center text-xs font-semibold tracking-tight text-white/95 w-full pt-1" data-purpose="status-bar">
<span class="text-sm font-semibold tracking-tighter">9:41</span>
<!-- Status Icons (Signal, 5G, Battery) -->
<div class="flex items-center space-x-2">
<!-- Signal Icon -->
<svg aria-hidden="true" class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.25 18.35C2.86 16.59 2 14.39 2 12 2 6.48 6.48 2 12 2s10 4.48 10 10c0 2.39-.86 4.59-2.25 6.35l-.72-.74C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 4c-2.76 0-5 2.24-5 5 0 1.28.48 2.45 1.28 3.34l.71-.72C8.38 13.97 8 13.03 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.03-.38 1.97-.99 2.62l.71.72c.8-.89 1.28-2.06 1.28-3.34 0-2.76-2.24-5-5-5zm0 8c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"></path>
</svg>
<span class="text-[11px] font-bold tracking-tight">5G</span>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-white rounded-2xs"></div>
</div>
</div>
</div>
<!-- Brand Header & Spatial Badge -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full bg-lime-electric shadow-[0_0_8px_#DDF83D]"></div>
<span class="text-sm font-extrabold tracking-wider uppercase text-white/95">MeasurePulse<span class="text-lime-electric">.AI</span></span>
</div>
<div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/20">
<span class="w-1.5 h-1.5 rounded-full bg-lime-electric animate-pulse"></span>
<span class="text-[10px] font-bold tracking-widest uppercase text-white/90">LiDAR Active</span>
</div>
</div>
</header>
<!-- END: Top Bar & Status Header -->
<!-- BEGIN: Upper Content & Hero Headline -->
<section class="relative z-10 px-6 pt-4 flex flex-col" data-purpose="hero-title-section">
<!-- Feature Pill Badge -->
<div class="inline-flex items-center space-x-2 self-start mb-3 px-3 py-1 rounded-full bg-black/40 backdrop-blur-lg border border-lime-electric/40 shadow-sm">
<span class="text-[10px] uppercase font-bold tracking-widest text-lime-electric">LiDAR 2.0 Engine</span>
<span class="text-white/40 text-xs">•</span>
<span class="text-[10px] font-medium tracking-wide text-white/80">Spatial Mesh</span>
</div>
<!-- Primary Title -->
<h1 class="text-4xl leading-[1.08] font-extrabold italic tracking-tight text-white drop-shadow-md">
        The Future of <br/>
<span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-white/90 to-lime-electric">
          Spatial Reality.
        </span>
</h1>
</section>
<!-- END: Upper Content & Hero Headline -->
<!-- BEGIN: Floating Tilted Frosted Glass Pill Section -->
<section class="relative z-20 my-auto px-4 flex justify-center items-center py-6" data-purpose="interactive-spatial-pill"><div class="w-full max-w-[348px] px-5 py-4 rounded-[28px] cursor-pointer transition-transform duration-300 hover:rotate-[-6deg] shadow-2xl" style="background: rgba(28, 30, 54, 0.58); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.22); transform: rotate(-7deg); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.35);">
<div class="flex items-center space-x-3.5">
<div class="relative flex-shrink-0 flex flex-col items-center justify-center">
<div class="w-12 h-12 rounded-full relative overflow-hidden flex items-center justify-center shadow-lg" style="background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d8b4fe 25%, #8b5cf6 48%, #4338ca 72%, #0d0133 100%); box-shadow: 0 0 22px rgba(168, 85, 247, 0.65), inset -2px -4px 10px rgba(0, 0, 0, 0.6);">
<div class="absolute top-2 left-2.5 w-3 h-1.5 bg-white/80 rounded-full blur-[0.6px] transform -rotate-12"></div>
</div>
<div class="absolute -bottom-1 w-2.5 h-2.5 rounded-full bg-lime-electric border-2 border-[#111322] shadow-[0_0_10px_#DDF83D]"></div>
</div>
<div class="flex flex-col flex-grow justify-center space-y-1 overflow-hidden">
<div class="flex items-center justify-between">
<span class="text-[13px] font-bold tracking-tight text-white whitespace-nowrap drop-shadow">
          Measure Higher. <span class="text-lime-electric font-semibold">SpatialAI</span>
</span>
</div>
<div class="text-[10px] font-medium tracking-wide text-[#E6E9FF]/80 uppercase">AI Room &amp; Renovation Advisor</div>
<div aria-label="Audio Waveform Visualization" class="flex items-end space-x-[3px] h-4 pt-0.5" data-purpose="waveform-meter">
<div class="wave-bar w-[3px] h-2 bg-white/90 rounded-full"></div>
<div class="wave-bar w-[3px] h-3 bg-white/90 rounded-full"></div>
<div class="wave-bar w-[3px] h-4 bg-lime-electric rounded-full"></div>
<div class="wave-bar w-[3px] h-2.5 bg-white/90 rounded-full"></div>
<div class="wave-bar w-[3px] h-4 bg-white/95 rounded-full"></div>
<div class="wave-bar w-[3px] h-1.5 bg-white/70 rounded-full"></div>
<div class="wave-bar w-[3px] h-3.5 bg-lime-electric rounded-full"></div>
<div class="wave-bar w-[3px] h-4 bg-white rounded-full"></div>
<div class="wave-bar w-[3px] h-2 bg-white/90 rounded-full"></div>
<div class="wave-bar w-[3px] h-3.5 bg-white/80 rounded-full"></div>
<div class="wave-bar w-[3px] h-2 bg-lime-electric rounded-full"></div>
<div class="wave-bar w-[3px] h-3 bg-white/90 rounded-full"></div>
<div class="wave-bar w-[3px] h-1.5 bg-white/60 rounded-full"></div>
</div>
</div>
</div>
</div></section>
<!-- END: Floating Tilted Frosted Glass Pill Section -->
<!-- BEGIN: Value Proposition & Bottom Action Navigation -->
<footer class="relative z-20 px-6 pb-9 pt-2 flex flex-col space-y-6" data-purpose="footer-controls">
<!-- Value Proposition / Subtext Card -->
<div class="glass-card-subtle rounded-2xl px-4 py-3.5 border border-white/10" data-purpose="value-proposition"><p class="text-xs leading-relaxed font-normal text-[#E6E9FF] tracking-wide">
  Sub-millimeter LiDAR point clouds, automated CAD vectors, and instant volumetric 3D blueprints in real-time.
</p></div>
<!-- Bottom Controls Row -->
<div class="flex items-center justify-between pt-1" data-purpose="action-navigation-bar"><div class="flex flex-col w-full space-y-3.5">
<!-- Wide Prominent Start Spatial Scan Action CTA -->
<button aria-label="Start Spatial Scan" class="w-full py-3.5 px-6 rounded-full bg-lime-electric text-deep-dark flex items-center justify-center font-bold text-sm tracking-wide shadow-electric-glow hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 focus:outline-none" type="button">
<span class="mr-2 text-deep-dark font-extrabold">Start Spatial Scan</span>
<svg class="w-5 h-5 stroke-[3] stroke-[#111322] fill-none transform transition-transform group-hover:translate-x-1" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Secondary Navigation: Skip & Pagination Dots Row -->
<div class="flex items-center justify-between px-2 pt-0.5">
<button aria-label="Skip onboarding" class="text-[#E6E9FF]/75 hover:text-[#E6E9FF] font-medium tracking-wide text-xs underline underline-offset-4 transition-colors focus:outline-none" type="button">
      Skip
    </button>
<div aria-label="Page Indicator" class="flex items-center space-x-1.5" data-purpose="pagination-dots">
<div class="w-6 h-1.5 rounded-full bg-lime-electric shadow-[0_0_8px_#DDF83D]"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white/35"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white/35"></div>
</div>
<span class="text-[11px] font-semibold text-lime-electric/90 tracking-wider uppercase font-mono">v2.0 AR</span>
</div>
</div></div>
<!-- iOS Home Indicator Bar -->
<div class="w-32 h-1 bg-white/30 rounded-full mx-auto self-center mt-2 pointer-events-none"></div>
</footer>
<!-- END: Value Proposition & Bottom Action Navigation -->
</main>
<!-- END: Mobile Device Frame Container -->
</body></html>
